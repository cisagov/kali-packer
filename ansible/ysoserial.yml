---
# ysoserial requires a Java implementation
- name: Install OpenJDK
  ansible.builtin.include_role:
    name: openjdk

- name: Install frohoff/ysoserial
  ansible.builtin.include_role:
    name: assessment_tool
  vars:
    assessment_tool_archive_src: https://github.com/frohoff/ysoserial/tarball/b7d0f27b46af06bbced7dbafddc49678179d3708
    assessment_tool_install_dir: /tools/ysoserial
    assessment_tool_unarchive_extra_opts:
      - --strip-components=1
